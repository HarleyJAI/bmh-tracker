<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Intake — Beyond Mobile Health</title>
<style>
  :root {
    --ink: #0e2438;
    --ink-soft: #45607a;
    --paper: #f6f8fa;
    --card: #ffffff;
    --line: #dbe4ec;
    --brand: #12507a;
    --brand-deep: #0d3a5a;
    --amber: #d98a2b;
    --ok: #1e7a53;
    --err: #b23a3a;
    --focus: #2f7fb8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* Progress bar */
  #progressWrap {
    position: fixed; top: 0; left: 0; right: 0; height: 4px;
    background: var(--line); z-index: 50;
  }
  #progressBar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--brand), var(--amber));
    transition: width .45s cubic-bezier(.16,.84,.44,1);
  }

  /* Header */
  header {
    position: fixed; top: 14px; left: 0; right: 0; z-index: 40;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 clamp(18px, 5vw, 60px);
    pointer-events: none;
  }
  .brand-mark {
    display: flex; align-items: center; gap: 10px;
    font-weight: 700; letter-spacing: -.01em; font-size: 15px; color: var(--ink);
  }
  .brand-mark .dot {
    width: 26px; height: 26px; border-radius: 7px;
    background: var(--brand); position: relative;
    display: grid; place-items: center;
  }
  .brand-mark .dot::after {
    content: ""; width: 10px; height: 10px; border-radius: 50%;
    background: var(--amber);
  }
  .step-count {
    font-size: 12.5px; font-weight: 600; color: var(--ink-soft);
    letter-spacing: .02em;
  }

  /* Slide viewport */
  #viewport {
    height: 100vh; width: 100%;
    position: relative;
    overflow: hidden;
  }
  .slide {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 96px clamp(20px, 6vw, 80px) 120px;
    opacity: 0; visibility: hidden;
    transform: translateY(40px);
    transition: opacity .4s ease, transform .5s cubic-bezier(.16,.84,.44,1);
    overflow-y: auto;
  }
  .slide.active { opacity: 1; visibility: visible; transform: translateY(0); }
  .slide.exit-up { transform: translateY(-40px); }

  .frame { width: 100%; max-width: 620px; }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: var(--brand);
    margin-bottom: 18px;
  }
  .eyebrow .num {
    font-variant-numeric: tabular-nums;
    background: var(--brand); color: #fff;
    padding: 2px 8px; border-radius: 5px; font-size: 11px;
  }
  h1.q {
    font-size: clamp(24px, 4.2vw, 38px);
    line-height: 1.15; letter-spacing: -.02em; font-weight: 700;
    margin-bottom: 10px;
  }
  .q .opt { color: var(--ink-soft); font-weight: 500; font-size: .62em; }
  p.help {
    font-size: 15px; color: var(--ink-soft); line-height: 1.5;
    margin-bottom: 30px; max-width: 52ch;
  }

  /* Inputs */
  .field { margin-bottom: 18px; }
  .field label {
    display: block; font-size: 13.5px; font-weight: 600;
    color: var(--ink); margin-bottom: 7px;
  }
  input[type=text], input[type=date], textarea {
    width: 100%; font-family: inherit; font-size: 18px; color: var(--ink);
    background: var(--card); border: 1.5px solid var(--line);
    border-radius: 12px; padding: 15px 16px; transition: border-color .18s, box-shadow .18s;
  }
  textarea { resize: vertical; min-height: 110px; font-size: 15px; line-height: 1.55; }
  input:focus, textarea:focus {
    outline: none; border-color: var(--focus);
    box-shadow: 0 0 0 4px rgba(47,127,184,.14);
  }
  input::placeholder, textarea::placeholder { color: #9fb0be; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 520px){ .two-col { grid-template-columns: 1fr; } }

  /* Checkbox grid */
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
  @media (max-width: 520px){ .checks { grid-template-columns: 1fr; } }
  .check {
    display: flex; align-items: center; gap: 12px;
    border: 1.5px solid var(--line); background: var(--card);
    border-radius: 11px; padding: 13px 15px; cursor: pointer;
    transition: border-color .15s, background .15s, transform .08s;
    user-select: none;
  }
  .check:hover { border-color: #b9cad8; }
  .check:active { transform: scale(.99); }
  .check .box {
    width: 22px; height: 22px; border-radius: 6px; flex: none;
    border: 1.5px solid #b2c2cf; display: grid; place-items: center;
    transition: background .15s, border-color .15s;
  }
  .check .box svg { width: 13px; height: 13px; opacity: 0; transform: scale(.6); transition: .15s; }
  .check .key {
    font-size: 11px; font-weight: 700; color: var(--ink-soft);
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 5px; padding: 1px 6px; margin-left: auto;
  }
  .check .label-txt { font-size: 15.5px; font-weight: 600; }
  .check .sub { font-size: 12px; color: var(--ink-soft); font-weight: 500; display: block; margin-top: 1px; }
  .check.checked { border-color: var(--brand); background: #eef5fa; }
  .check.checked .box { background: var(--brand); border-color: var(--brand); }
  .check.checked .box svg { opacity: 1; stroke: #fff; transform: scale(1); }

  #otherBox { margin-top: 6px; display: none; }
  #otherBox.show { display: block; animation: drop .3s ease; }
  .test-search-wrap { position: relative; margin-bottom: 12px; }
  #testSearch { width:100%; padding:13px 15px; font-size:15px; border:2px solid var(--line);
    border-radius:12px; font-family:inherit; outline:none; }
  #testSearch:focus { border-color: var(--brand); }
  .test-results { position:absolute; left:0; right:0; top:100%; margin-top:6px; background:#fff;
    border:1px solid var(--line); border-radius:12px; box-shadow:0 12px 30px rgba(10,22,40,.12);
    z-index:20; overflow:hidden; display:none; }
  .test-results.show { display:block; }
  .test-hit { padding:11px 15px; cursor:pointer; display:flex; flex-direction:column; gap:1px; }
  .test-hit:hover { background:var(--surface-2,#f4f7fb); }
  .test-hit strong { font-size:14px; }
  .test-hit span { font-size:12px; color:var(--ink-soft); }
  .test-hit.none { cursor:default; color:var(--ink-soft); font-size:13px; }
  .selected-tests { display:flex; flex-wrap:wrap; gap:8px; min-height:20px; }
  .sel-empty { font-size:13px; color:var(--ink-soft); }
  .sel-chip { display:inline-flex; align-items:center; gap:7px; background:var(--brand,#12507a);
    color:#fff; font-size:13px; font-weight:600; padding:6px 12px; border-radius:20px; }
  .sel-chip .rm { cursor:pointer; opacity:.85; font-size:11px; }
  .sel-chip .rm:hover { opacity:1; }
  .sel-chip.mini { background:#e8eef7; color:#12507a; font-size:12px; padding:3px 9px; margin:2px; }
  .other-preview { margin-top:8px; font-size:12.5px; color:var(--ink-soft); }
  @keyframes drop { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

  /* Upload */
  .drop {
    border: 2px dashed var(--line); border-radius: 14px;
    padding: 34px 20px; text-align: center; cursor: pointer;
    background: var(--card); transition: border-color .18s, background .18s;
  }
  .drop:hover, .drop.drag { border-color: var(--brand); background: #eef5fa; }
  .drop .ico { font-size: 30px; margin-bottom: 8px; }
  .drop strong { color: var(--brand); }
  .drop small { display: block; color: var(--ink-soft); margin-top: 6px; font-size: 12.5px; }
  #fileList { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .file-chip {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1.5px solid var(--line);
    border-radius: 10px; padding: 10px 13px; font-size: 14px;
  }
  .file-chip .fname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-chip .fsize { color: var(--ink-soft); font-size: 12px; margin-left: auto; flex: none; }
  .file-chip button {
    background: none; border: none; cursor: pointer; color: var(--err);
    font-size: 18px; line-height: 1; padding: 2px; flex: none;
  }
  .divider-or { text-align: center; color: var(--ink-soft); font-size: 12px; font-weight: 600; letter-spacing: .05em; margin: 14px 0; }

  /* Footer nav */
  .navrow {
    display: flex; align-items: center; gap: 14px; margin-top: 28px;
  }
  .btn {
    font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
    border: none; border-radius: 11px; padding: 14px 26px;
    display: inline-flex; align-items: center; gap: 9px;
    transition: transform .08s, background .18s, box-shadow .18s;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--brand); color: #fff; box-shadow: 0 6px 18px rgba(18,80,122,.24); }
  .btn-primary:hover { background: var(--brand-deep); }
  .btn-ghost { background: transparent; color: var(--ink-soft); padding: 14px 8px; }
  .btn-ghost:hover { color: var(--ink); }
  .enter-hint { font-size: 12.5px; color: var(--ink-soft); display: inline-flex; align-items: center; gap: 6px; }
  .enter-hint kbd {
    background: var(--card); border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 5px; padding: 2px 6px; font-family: inherit; font-size: 11px; font-weight: 700;
  }
  .err-msg { color: var(--err); font-size: 13px; font-weight: 600; margin-top: 8px; display: none; }
  .err-msg.show { display: block; }

  /* fixed bottom bar for up/down nav */
  #dpad {
    position: fixed; right: clamp(16px, 4vw, 40px); bottom: 22px; z-index: 40;
    display: flex; flex-direction: column; gap: 6px;
  }
  #dpad button {
    width: 40px; height: 34px; border-radius: 8px; cursor: pointer;
    background: var(--card); border: 1.5px solid var(--line); color: var(--ink-soft);
    display: grid; place-items: center; transition: .15s;
  }
  #dpad button:hover:not(:disabled) { border-color: var(--brand); color: var(--brand); }
  #dpad button:disabled { opacity: .35; cursor: not-allowed; }

  /* Review + success */
  .review-card {
    background: var(--card); border: 1.5px solid var(--line); border-radius: 14px;
    padding: 6px 20px; margin-bottom: 24px;
  }
  .review-row {
    display: flex; justify-content: space-between; gap: 16px;
    padding: 13px 0; border-bottom: 1px solid var(--line);
  }
  .review-row:last-child { border-bottom: none; }
  .review-row .k { font-size: 13px; color: var(--ink-soft); font-weight: 600; flex: none; }
  .review-row .v { font-size: 14.5px; font-weight: 600; text-align: right; }
  .review-row .v.empty { color: #9fb0be; font-weight: 500; font-style: italic; }
  .tag {
    display: inline-block; background: #eef5fa; color: var(--brand);
    border: 1px solid #cfe0ec; border-radius: 6px; padding: 2px 9px;
    font-size: 12.5px; font-weight: 700; margin: 2px 0 2px 6px;
  }

  #successCheck {
    width: 84px; height: 84px; border-radius: 50%; background: var(--ok);
    display: grid; place-items: center; margin-bottom: 26px;
    animation: pop .5s cubic-bezier(.16,.84,.44,1);
  }
  @keyframes pop { 0%{transform:scale(0)} 70%{transform:scale(1.1)} 100%{transform:scale(1)} }
  #successCheck svg { width: 42px; height: 42px; stroke: #fff; }

  .confid {
    background: #fff8ee; border: 1px solid #f0dcbb; border-radius: 10px;
    padding: 12px 15px; font-size: 12.5px; color: #8a6414; line-height: 1.5;
    display: flex; gap: 9px; margin-top: 22px;
  }

  /* Mode select cards */
  .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 8px; }
  @media (max-width: 560px){ .mode-grid { grid-template-columns: 1fr; } }
  .mode-card {
    border: 1.5px solid var(--line); background: var(--card); border-radius: 14px;
    padding: 22px 20px; cursor: pointer; text-align: left;
    transition: border-color .15s, transform .08s, box-shadow .15s;
  }
  .mode-card:hover { border-color: var(--brand); box-shadow: 0 8px 22px rgba(18,80,122,.12); }
  .mode-card:active { transform: scale(.99); }
  .mode-card.sel { border-color: var(--brand); background: #eef5fa; box-shadow: 0 0 0 3px rgba(18,80,122,.12); }
  .mode-card .mi { font-size: 30px; margin-bottom: 12px; display: block; }
  .mode-card h3 { font-size: 18px; font-weight: 700; margin-bottom: 5px; letter-spacing: -.01em; }
  .mode-card p { font-size: 13.5px; color: var(--ink-soft); line-height: 1.45; }

  /* Patient counter chip in header area of a slide */
  .pt-chip {
    display: inline-flex; align-items: center; gap: 7px;
    background: #eef5fa; border: 1px solid #cfe0ec; color: var(--brand);
    border-radius: 20px; padding: 4px 12px; font-size: 12px; font-weight: 700;
    margin-bottom: 16px;
  }
  .pt-chip .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); }

  /* Roster (multi-patient add/finish + review) */
  .roster { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .roster-item {
    display: flex; align-items: center; gap: 13px;
    background: var(--card); border: 1.5px solid var(--line); border-radius: 12px;
    padding: 14px 16px;
  }
  .roster-item .idx {
    width: 30px; height: 30px; border-radius: 8px; flex: none;
    background: var(--brand); color: #fff; display: grid; place-items: center;
    font-size: 13px; font-weight: 700;
  }
  .roster-item .meta { min-width: 0; flex: 1; }
  .roster-item .rn { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
  .roster-item .rd { font-size: 12.5px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .roster-item .ract { display: flex; gap: 4px; flex: none; }
  .roster-item .ract button {
    background: none; border: 1px solid var(--line); border-radius: 7px; cursor: pointer;
    padding: 5px 8px; font-size: 12px; font-weight: 600; color: var(--ink-soft); transition: .15s;
  }
  .roster-item .ract button:hover { border-color: var(--brand); color: var(--brand); }
  .roster-item .ract button.del:hover { border-color: var(--err); color: var(--err); }
  .roster-empty { color: var(--ink-soft); font-size: 14px; font-style: italic; padding: 8px 0 4px; }
  .add-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
  .btn-add { background: #eef5fa; color: var(--brand); border: 1.5px solid #cfe0ec; }
  .btn-add:hover { background: #e2eef7; }

  /* Notification block */
  .notify-block {
    background: var(--paper); border: 1.5px solid var(--line);
    border-radius: 14px; padding: 18px 18px 16px; margin-top: 6px; margin-bottom: 4px;
  }
  .notify-head { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; letter-spacing: -.01em; margin-bottom: 4px; }
  .notify-head .ni { font-size: 17px; }
  .notify-sub { font-size: 13px; color: var(--ink-soft); line-height: 1.5; margin-bottom: 14px; }
  .sel-input {
    width:100%; font-family:inherit; font-size:18px; color:var(--ink);
    background:var(--card); border:1.5px solid var(--line); border-radius:12px;
    padding:15px 16px; appearance:none; -webkit-appearance:none; cursor:pointer;
    background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2345607a' stroke-width='2.5'%3e%3cpath d='M6 9l6 6 6-6'/%3e%3c/svg%3e");
    background-repeat:no-repeat; background-position:right 14px center; background-size:18px;
  }
  .sel-input:focus { outline:none; border-color:var(--focus); box-shadow:0 0 0 4px rgba(47,127,184,.14); }
  .hint-note { font-size:12px; color:var(--ink-soft); margin-top:6px; line-height:1.45; }
  .match-banner {
    background:#eef7f1; border:1.5px solid #cbe6d6; border-radius:12px;
    padding:14px 16px; margin-bottom:16px; font-size:13.5px; line-height:1.55; color:#14603f;
  }
  .match-banner strong { color:#0e4a30; }
  .match-banner .rq {
    display:inline-block; background:var(--ok); color:#fff; font-weight:800;
    border-radius:6px; padding:1px 9px; font-size:12px; margin-left:4px;
  }
  .notify-confirm {
    background: #eef7f1; border: 1px solid #cbe6d6; color: var(--ok);
    border-radius: 10px; padding: 12px 16px; font-size: 13.5px; line-height: 1.5;
    margin-top: 4px; max-width: 46ch;
  }
</style>
</head>
<body>
<div id="progressWrap"><div id="progressBar"></div></div>

<header>
  <div class="brand-mark">
    <span class="dot"></span>
    Beyond Mobile Health
  </div>
  <div class="step-count" id="stepCount">1 → 8</div>
</header>

<div id="viewport"></div>

<div id="dpad">
  <button id="upBtn" aria-label="Previous">▲</button>
  <button id="downBtn" aria-label="Next">▼</button>
</div>

<script>
// ============================================================
//  BMH Mobile Lab Intake — supports individual OR batch orders
// ============================================================

// ---------- Supabase (browser client via REST) ----------
const SB_URL = "https://hnamuztnddupqasikrfi.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhuYW11enRuZGR1cHFhc2lrcmZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxODY5MjcsImV4cCI6MjA5MDc2MjkyN30.Y2fWzyzMv1HJcjaBx6dvzhdhkOkZSo6eakif4T2I-1M";
const RAILWAY_URL = "https://bmh-tracker-production.up.railway.app";

function newOrderId(){
  const d = new Date();
  const stamp = d.getFullYear().toString().slice(2)
    + String(d.getMonth()+1).padStart(2,"0")
    + String(d.getDate()).padStart(2,"0");
  const rand = Math.random().toString(36).slice(2,7).toUpperCase();
  return `BMH-${stamp}-${rand}`;
}

const sbHeaders = {
  "apikey": SB_KEY,
  "Authorization": `Bearer ${SB_KEY}`,
  "Content-Type": "application/json"
};
const digitsOnly = s => String(s||"").replace(/\D/g,"");
const nameKey    = s => String(s||"").trim().toLowerCase().replace(/\s+/g," ");

// --- Patient matching -------------------------------------------------
// Audit basis: MRN blank on 63% of records, DOB blank on 56%, but phone
// present on 385/399 and identical across every duplicate group.
// Order of trust: MRN > name+DOB > name+phone.
async function findExistingPerson(p){
  const phone = digitsOnly(p.telephone);
  const nk    = nameKey(`${p.firstName} ${p.lastName}`);

  // 1. MRN is the strongest signal when present
  if(p.mrn && p.mrn.trim()){
    const r = await fetch(`${SB_URL}/rest/v1/people?select=*&mrn=eq.${encodeURIComponent(p.mrn.trim())}&limit=1`,
      { headers: sbHeaders });
    if(r.ok){ const j = await r.json(); if(j.length) return { person:j[0], basis:"MRN" }; }
  }

  // 2 & 3. Pull candidates on phone, then confirm by name (and DOB if we have it).
  if(phone){
    const r = await fetch(`${SB_URL}/rest/v1/people?select=*&phone_digits=eq.${encodeURIComponent(phone)}&limit=25`,
      { headers: sbHeaders });
    if(r.ok){
      const cands = await r.json();
      // 18 phone numbers are shared by multiple names (households/facilities),
      // so phone alone is never sufficient — the name must agree too.
      const byName = cands.filter(c => nameKey(c.full_name) === nk);
      if(byName.length){
        if(p.dob){
          const exact = byName.find(c => String(c.dob||"").slice(0,10) === p.dob);
          if(exact) return { person:exact, basis:"name + DOB" };
        }
        return { person:byName[0], basis:"name + phone" };
      }
    }
  }
  return null;
}

async function countExistingOrders(personId){
  const r = await fetch(`${SB_URL}/rest/v1/orders?select=id,recurrence_group_id&person_id=eq.${personId}`,
    { headers: sbHeaders });
  if(!r.ok) return 0;
  const j = await r.json();
  if(!Array.isArray(j)) return 0;
  // A recurring series counts as ONE request, not one per occurrence.
  const groups = new Set(j.map(o => o.recurrence_group_id || o.id));
  return groups.size;
}

async function createPerson(p){
  const body = {
    mrn: p.mrn || null,
    first_name: p.firstName,
    last_name: p.lastName,
    full_name: `${p.firstName} ${p.lastName}`.trim(),
    dob: p.dob || null,
    phone: p.telephone || null,
    phone_digits: digitsOnly(p.telephone) || null,
    email: form.notifyEmail || null,
    home_address: p.address || null,
    language: p.language || "English",
    language_other: p.language === "Other" ? (p.languageOther || null) : null,
    interpreter_needed: !!(p.language && p.language !== "English"),
    alt_contact_name: p.altName || null,
    alt_contact_phone: p.altPhone || null,
    alt_contact_title: p.altTitle || null
  };
  const r = await fetch(`${SB_URL}/rest/v1/people`, {
    method:"POST",
    headers: { ...sbHeaders, "Prefer":"return=representation" },
    body: JSON.stringify(body)
  });
  if(!r.ok) throw new Error(`person insert (${r.status}) ${(await r.text()).slice(0,140)}`);
  return (await r.json())[0];
}

// Enrich an existing person with any field they were missing.
async function enrichPerson(person, p){
  const patch = {};
  if(!person.mrn && p.mrn)                 patch.mrn = p.mrn;
  if(!person.dob && p.dob)                 patch.dob = p.dob;
  if(!person.home_address && p.address)    patch.home_address = p.address;
  if(!person.phone && p.telephone)         { patch.phone = p.telephone; patch.phone_digits = digitsOnly(p.telephone); }
  if(p.language && p.language !== person.language) patch.language = p.language;
  if(!person.alt_contact_name && p.altName){
    patch.alt_contact_name = p.altName;
    patch.alt_contact_phone = p.altPhone || null;
    patch.alt_contact_title = p.altTitle || null;
  }
  if(!Object.keys(patch).length) return person;
  patch.updated_at = new Date().toISOString();
  const r = await fetch(`${SB_URL}/rest/v1/people?id=eq.${person.id}`, {
    method:"PATCH",
    headers: { ...sbHeaders, "Prefer":"return=representation" },
    body: JSON.stringify(patch)
  });
  if(!r.ok) return person;
  return (await r.json())[0] || person;
}

// Compute which billing-critical fields are absent.
function missingFieldsFor(p){
  const m = [];
  if(!p.address)        m.push("service_address");
  if(!p.accessNotes)    m.push("access_notes");
  if(!p.dob)            m.push("dob");
  if(!p.mrn)            m.push("mrn");
  if(!p.telephone)      m.push("phone");
  if(!testNames(p).length) m.push("test_type");
  if(!p.physicianName)  m.push("provider");
  if(!p.npi)            m.push("provider_npi");
  return m;
}

// Build the order row(s). A weekly order generates ONE ROW PER OCCURRENCE
// so every draw is individually dated, trackable and billable.
function buildOrders(p, personId, startingRequestNo){
  const missing = missingFieldsFor(p);
  const base = {
    person_id: personId,
    source: "web_intake",
    org_id: "bmc",
    status: "received",
    test_type: testNames(p).join(", "),
    tests: testNames(p),
    provider: p.physicianName || null,
    provider_npi: p.npi || null,
    service_address: p.address || null,
    access_notes: p.accessNotes || null,
    best_time: p.bestTime || null,
    billing_ready: missing.length === 0,
    missing_fields: missing,
    notify_email: notifyEmails()[0] || null,
    notify_consent: !!form.notifyConsent,
    notes: p.orderPaste || null,
    payload: {
      attachments: p.files.map(f=>f.name),
      order_pasted: !!p.orderPaste,
      submitted_by: form.submittedBy,
      submitted_date: form.inputDate,
      other_test: p.otherTest || null,
      notify_emails: notifyEmails(),
      order_mode: form.mode,
      language: p.language,
      language_other: p.languageOther || null
    }
  };

  if(p.recurring === true && p.recurDays.length && p.recurStart && p.recurEnd){
    const dayIdx = { Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6 };
    const want = p.recurDays.map(d=>dayIdx[d]).filter(n=>n!==undefined);
    const groupId = crypto.randomUUID();
    const out = [];
    const start = new Date(p.recurStart + "T00:00:00");
    const end   = new Date(p.recurEnd   + "T00:00:00");
    for(let d = new Date(start); d <= end; d.setDate(d.getDate()+1)){
      if(want.includes(d.getDay())){
        out.push({ ...base,
          id: newOrderId(),
          requested_date: d.toISOString().slice(0,10),
          is_recurring: true,
          recurrence_group_id: groupId
        });
      }
      if(out.length > 200) break; // safety cap
    }
    return out.map((o,i)=>({ ...o,
      request_no: startingRequestNo,
      occurrence_index: i+1,
      occurrence_total: out.length
    }));
  }

  return [{ ...base,
    id: newOrderId(),
    requested_date: form.submissionDate || null,
    request_no: startingRequestNo,
    is_recurring: false
  }];
}

async function submitToSupabase(){
  try {
    const results = [];
    for(const p of form.patients){
      const match = await findExistingPerson(p);
      let person, isReturning = false, basis = null;

      if(match){
        person = await enrichPerson(match.person, p);
        isReturning = true;
        basis = match.basis;
      } else {
        person = await createPerson(p);
      }

      const priorCount = isReturning ? await countExistingOrders(person.id) : 0;
      const rows = buildOrders(p, person.id, priorCount + 1);

      const r = await fetch(`${SB_URL}/rest/v1/orders`, {
        method:"POST",
        headers: { ...sbHeaders, "Prefer":"return=representation" },
        body: JSON.stringify(rows)
      });
      if(!r.ok) throw new Error(`order insert (${r.status}) ${(await r.text()).slice(0,140)}`);
      const saved = await r.json();

      // Upload the requisition file (if any) and stamp its path on the order(s).
      // The bytes go to a PRIVATE Supabase Storage bucket; only the path is stored.
      const reqFile = (p.files && p.files[0] && p.files[0].blob) ? p.files[0] : null;
      if(reqFile && saved.length){
        try {
          const primaryId = saved[0].id;
          const safeName = reqFile.name.replace(/[^a-zA-Z0-9._-]/g, "_");
          const objectPath = `${primaryId}/${safeName}`;
          const up = await fetch(
            `${SB_URL}/storage/v1/object/requisitions/${encodeURIComponent(objectPath)}`,
            { method:"POST",
              headers: { "apikey": SB_KEY, "Authorization": `Bearer ${SB_KEY}`,
                         "Content-Type": reqFile.blob.type || "application/octet-stream",
                         "x-upsert": "true" },
              body: reqFile.blob });
          if(up.ok){
            // Stamp the path on every occurrence row of this order.
            const ids = saved.map(x=>x.id);
            await fetch(`${SB_URL}/rest/v1/orders?id=in.(${ids.join(",")})`, {
              method:"PATCH",
              headers: { ...sbHeaders },
              body: JSON.stringify({ requisition_path: objectPath })
            });
          } else {
            console.error("requisition upload failed", up.status, await up.text());
          }
        } catch(upErr){
          console.error("requisition upload error", upErr);
          // Non-fatal: the order is saved; the file just didn't attach.
        }
      }

      // Fire the GHL workflow (notifications / calendar / assignment) via
      // Railway — server-side, so the GHL trigger URL stays private. The order
      // is already safely in the tracker; this push is best-effort.
      if(saved.length){
        try {
          await fetch(`${RAILWAY_URL}/api/intake-submitted`, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body: JSON.stringify({ orderId: saved[0].id })
          });
        } catch(ghlErr){
          console.error("GHL bridge call failed (non-fatal)", ghlErr);
        }
      }

      results.push({
        name: fullName(p),
        isReturning,
        basis,
        requestNo: priorCount + 1,
        priorCount,
        orderIds: saved.map(x=>x.id),
        occurrences: saved.length
      });
    }
    form.submitResults = results;
    form.savedIds = results.flatMap(r=>r.orderIds);
    return { ok:true };
  } catch(e){
    return { ok:false, error: e.message || "Network error" };
  }
}

function showSubmitError(msg){
  let box = document.getElementById("submitErr");
  if(!box){
    box = document.createElement("div");
    box.id = "submitErr";
    box.className = "err-msg show";
    box.style.marginTop = "14px";
    const nav = document.querySelector(".navrow");

  }
  box.classList.add("show");
  box.textContent = "Could not submit: " + msg + " — please try again or contact BMH.";
}

// ---------- Helpers ----------
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmtDate(d){
  if(!d) return "";
  const s = String(d).trim();
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${m[2]}/${m[3]}/${m[1]}` : s;
}
function isValidNPI(n){ return /^\d{10}$/.test(n); }
function fullName(p){ return (p.firstName+" "+p.lastName).trim(); }
function testNames(p){
  const names = p.tests.filter(t=>t!=='__other').map(id=>{ const t=LAB_TESTS.find(x=>x.id===id); return t?t.name:id; });
  if(p.otherTest){
    // Each comma-separated custom test becomes its own entry (not one blob).
    p.otherTest.split(",").map(s=>s.trim()).filter(Boolean).forEach(s=> names.push(s));
  }
  return names;
}
function testTags(p){
  const n = testNames(p);
  return n.length ? n.map(x=>`<span class="tag">${esc(x)}</span>`).join("") : "";
}
function recurSummary(p){
  if(p.recurring!==true) return p.recurring===false ? "One-time draw" : "";
  const days = p.recurDays.join(", ");
  const dur = p.recurWeeks ? ` · ${esc(p.recurWeeks)}` : "";
  const range = (p.recurStart||p.recurEnd) ? ` · ${fmtDate(p.recurStart)}–${fmtDate(p.recurEnd)}` : "";
  return `Weekly (${days||"no days"})${dur}${range}`;
}
function notifyEmails(){
  return (form.notifyEmail||"").split(",").map(s=>s.trim()).filter(Boolean);
}
function validEmail(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }
function notifySummary(){
  const list = notifyEmails();
  if(!form.notifyConsent || !list.length) return "Off";
  if(list.length===1) return `On → ${esc(list[0])} (scheduled & completed)`;
  return `On → ${list.length} recipients (scheduled & completed)`;
}

// ---------- Flow control ----------
// Build the active slide sequence based on mode.
function sequence(){
  return slides.filter(s=>{
    if(s.batchOnly && form.mode!=="batch") return false;
    return true;
  });
}
let seq = sequence();
let idx = 0;
let els = [];

const viewport = document.getElementById("viewport");

function rebuildSeq(){
  seq = sequence();
}

function render(){
  const s = seq[idx];
  viewport.innerHTML = "";
  const div = document.createElement("div");
  div.className = "slide active";
  div.innerHTML = s.render();
  viewport.appendChild(div);
  els = [div];
  wire();
  updateChrome();
  setTimeout(()=>{
    const inp = div.querySelector("input:not([type=file]), textarea");
    if(inp && s.key!=="altcontact" && s.key!=="review" && s.key!=="mode" && s.key!=="gate" && s.key!=="recurring") inp.focus();
  }, 60);
}

function go(n, dir){
  const cur = els[0];
  if(cur){
    cur.classList.remove("active");
    if(dir==="up") cur.classList.add("exit-up");
    cur.style.opacity = "0";
  }
  idx = Math.max(0, Math.min(seq.length-1, n));
  setTimeout(render, 180);
}

function updateChrome(){
  const total = seq.length;
  document.getElementById("progressBar").style.width = ((idx)/(total-1)*100)+"%";
  const s = seq[idx];
  let label;
  if(s.key==="done") label = "Complete";
  else if(s.key==="mode"||s.key==="welcome") label = "Getting started";
  else if(form.mode==="batch" && s.perPatient) label = `Patient ${form.current+1} · ${humanStep()}`;
  else label = humanStep();
  document.getElementById("stepCount").textContent = label;
  document.getElementById("upBtn").disabled = idx===0;
  document.getElementById("downBtn").disabled = idx>=seq.length-1;
}
function humanStep(){
  const n = seq.slice(0, idx+1).filter(s=>!["welcome","mode","done"].includes(s.key)).length;
  const tot = seq.filter(s=>!["welcome","mode","done"].includes(s.key)).length;
  return `${n} → ${tot}`;
}

// ---------- Save current slide into model ----------
function save(){
  const s = seq[idx];
  const cur = els[0];
  if(!cur) return;
  const g = id => { const el = cur.querySelector("#"+id); return el?el.value.trim():undefined; };

  if(s.perPatient){
    const p = P();
    ["firstName","lastName","address","dob","telephone","mrn",
     "altName","altPhone","altTitle","otherTest","physicianName","npi",
     "recurWeeks","recurStart","recurEnd","bestTime","language","languageOther"].forEach(f=>{
      const v = g(f); if(v!==undefined) p[f]=v;
    });
    const acc = cur.querySelector("#accessNotes"); if(acc) p.accessNotes = acc.value.trim();
    const paste = cur.querySelector("#orderPaste"); if(paste) p.orderPaste = paste.value;
    // tests + files handled live
  }
  if(s.key==="submitter"){
    const sb=g("submittedBy"); if(sb!==undefined) form.submittedBy=sb;
    const sd=g("submissionDate"); if(sd!==undefined) form.submissionDate=sd;
    form.inputDate = form.submissionDate;
    const ne=g("notifyEmail"); if(ne!==undefined) form.notifyEmail=ne;
  }
}

// ---------- Validation ----------
function validate(){
  const k = seq[idx].key;
  save();
  if(k==="patient"){
    const p=P();
    if(!p.firstName||!p.lastName||!p.address||!p.dob||!p.telephone||!p.mrn){ flag("err-patient"); return false; }
    if(p.language==="Other" && !p.languageOther){
      flag("err-patient");
      const em=document.getElementById("err-patient");
      if(em) em.textContent="Please specify which language the patient speaks.";
      return false;
    }
  }
  if(k==="altcontact"){
    const p=P();
    if(!p.accessNotes){ flag("err-access"); return false; }
  }
  if(k==="tests"){
    const p=P();
    const presets = p.tests.filter(t=>t!=='__other').length>0;
    const otherChecked = p.tests.includes('__other');
    const otherFilled = p.otherTest.trim()!=="";
    if(!(presets||otherFilled)){
      flag("err-tests");
      const em=document.getElementById("err-tests");
      if(em) em.textContent = otherChecked && !otherFilled
        ? "You selected Other — type the requested test in the box to continue."
        : "Select at least one test (or specify one under Other).";
      return false;
    }
  }
  if(k==="recurring"){
    const p=P();
    if(p.recurring===null){ flag("err-recur"); const em=document.getElementById("err-recur"); if(em) em.textContent="Choose whether this patient needs a weekly draw."; return false; }
    if(p.recurring===true){
      if(p.recurDays.length===0 || !p.recurStart || !p.recurEnd){ flag("err-recur"); const em=document.getElementById("err-recur"); if(em) em.textContent="For weekly draws, select at least one collection day and a start & end date."; return false; }
      if(p.recurEnd < p.recurStart){ flag("err-recur"); const em=document.getElementById("err-recur"); if(em) em.textContent="End date can't be before the start date."; return false; }
    }
  }
  if(k==="physician"){
    const p=P();
    if(!p.physicianName || !isValidNPI(p.npi)){ flag("err-physician"); return false; }
  }
  if(k==="submitter"){
    if(!form.submittedBy){ flag("err-submitter"); const em=document.getElementById("err-submitter"); if(em) em.textContent="Please enter who is submitting this form."; return false; }
    if(form.notifyConsent){
      const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.notifyEmail);
      if(!ok){ flag("err-submitter"); const em=document.getElementById("err-submitter"); if(em) em.textContent="Enter a valid notification email, or uncheck email updates."; return false; }
    }
  }
  return true;
}
function flag(id){ const e=document.querySelector("#"+id); if(e) e.classList.add("show"); }

// ---------- Next / Prev with batch logic ----------
function next(skip=false){
  const k = seq[idx].key;
  if(!skip && !validate()) return; else save();

  // End of a patient's physician step in batch mode → go to gate
  if(k==="physician" && form.mode==="batch"){
    // jump to gate slide
    const gateIdx = seq.findIndex(s=>s.key==="gate");
    go(gateIdx, "up");
    return;
  }
  if(idx < seq.length-1) go(idx+1, "up");
}
function prev(){ save(); if(idx>0) go(idx-1, "down"); }

// ---------- Add / edit / delete patient (batch) ----------
function startNewPatient(){
  form.patients.push(blankPatient());
  form.current = form.patients.length-1;
  const patientIdx = seq.findIndex(s=>s.key==="patient");
  go(patientIdx, "up");
}
function editPatient(i){
  form.current = i;
  const patientIdx = seq.findIndex(s=>s.key==="patient");
  go(patientIdx, "up");
}
function deletePatient(i){
  form.patients.splice(i,1);
  if(form.patients.length===0){ form.patients.push(blankPatient()); }
  form.current = Math.min(form.current, form.patients.length-1);
  render(); // refresh gate
}

// ---------- Wire per-render ----------
function wire(){
  const cur = els[0];

  cur.querySelectorAll("[data-next]").forEach(b=> b.onclick = ()=> next(b.hasAttribute("data-skip")));
  cur.querySelectorAll("[data-prev]").forEach(b=> b.onclick = prev);

  // mode select
  cur.querySelectorAll("[data-mode]").forEach(b=>{
    b.onclick = ()=>{
      form.mode = b.dataset.mode;
      form.current = 0;
      form.patients = [blankPatient()];
      rebuildSeq();
      go(idx+1, "up");
    };
  });

  // clear errors on input
  cur.querySelectorAll("input, textarea").forEach(inp=>{
    inp.addEventListener("input", ()=>{
      const em = inp.closest(".frame")?.querySelector(".err-msg.show");
      if(em) em.classList.remove("show");
    });
  });

  // tests
  const checks = cur.querySelector("#checks");
  // ----- Searchable test picker -----
  const searchInput = cur.querySelector("#testSearch");
  const resultsBox  = cur.querySelector("#testResults");
  const selectedBox = cur.querySelector("#selectedTests");

  function renderSelected(){
    const p=P();
    const chosen = p.tests.filter(t=>t!=='__other');
    selectedBox.innerHTML = chosen.length
      ? chosen.map(id=>{
          const t=LAB_TESTS.find(x=>x.id===id);
          const label = t?t.name:id;
          return `<span class="sel-chip" data-rm="${id}">${label} <span class="rm">✕</span></span>`;
        }).join("")
      : `<span class="sel-empty">No tests selected yet</span>`;
    selectedBox.querySelectorAll("[data-rm]").forEach(ch=>{
      ch.onclick = ()=>{ const p=P(); p.tests=p.tests.filter(t=>t!==ch.dataset.rm); renderSelected(); };
    });
  }

  function renderResults(q){
    const p=P();
    q=(q||"").trim().toLowerCase();
    if(!q){ resultsBox.classList.remove("show"); resultsBox.innerHTML=""; return; }
    const hits = LAB_TESTS.filter(t=>
      !p.tests.includes(t.id) &&
      ((t.name+" "+t.sub+" "+t.id).toLowerCase().includes(q))
    ).slice(0,8);
    resultsBox.innerHTML = hits.length
      ? hits.map(t=>`<div class="test-hit" data-add="${t.id}"><strong>${t.name}</strong><span>${t.sub}</span></div>`).join("")
      : `<div class="test-hit none">No match — use "Other" below for custom tests</div>`;
    resultsBox.classList.add("show");
    resultsBox.querySelectorAll("[data-add]").forEach(h=>{
      h.onclick = ()=>{
        const p=P();
        if(!p.tests.includes(h.dataset.add)) p.tests.push(h.dataset.add);
        searchInput.value=""; renderResults(""); renderSelected(); searchInput.focus();
      };
    });
  }

  if(searchInput){
    searchInput.addEventListener("input", ()=>renderResults(searchInput.value));
    searchInput.addEventListener("focus", ()=>renderResults(searchInput.value));
    renderSelected();
  }

  // ----- Other toggle + comma-split preview -----
  const otherToggle = cur.querySelector("#otherToggle");
  if(otherToggle){
    otherToggle.onclick = ()=>{
      const p=P();
      otherToggle.classList.toggle("checked");
      const on=otherToggle.classList.contains("checked");
      const box=cur.querySelector("#otherBox");
      box.classList.toggle("show", on);
      if(on){ if(!p.tests.includes("__other")) p.tests.push("__other"); setTimeout(()=>cur.querySelector("#otherTest").focus(),50); }
      else { p.tests=p.tests.filter(t=>t!=="__other"); cur.querySelector("#otherTest").value=""; p.otherTest=""; renderOtherPreview(""); }
    };
  }
  function renderOtherPreview(v){
    const box=cur.querySelector("#otherPreview");
    if(!box) return;
    const parts=(v||"").split(",").map(s=>s.trim()).filter(Boolean);
    box.innerHTML = parts.length
      ? "Will be added as: " + parts.map(s=>`<span class="sel-chip mini">${s}</span>`).join("")
      : "";
  }
  const ot = cur.querySelector("#otherTest");
  if(ot){
    ot.addEventListener("input", ()=>{ P().otherTest = ot.value.trim(); renderOtherPreview(ot.value); });
    renderOtherPreview(ot.value);
  }

  // recurring draw toggle
  const recurToggle = cur.querySelector("#recurToggle");
  if(recurToggle){
    const detail = cur.querySelector("#recurDetail");
    recurToggle.querySelectorAll("[data-recur]").forEach(b=>{
      b.onclick = ()=>{
        const yes = b.dataset.recur==="yes";
        P().recurring = yes;
        recurToggle.querySelectorAll(".mode-card").forEach(c=>c.classList.remove("sel"));
        b.classList.add("sel");
        if(yes){ detail.style.display=""; detail.classList.add("show"); }
        else { detail.style.display="none"; detail.classList.remove("show"); }
        const em = cur.querySelector("#err-recur"); if(em) em.classList.remove("show");
      };
    });
    const dayChecks = cur.querySelector("#dayChecks");
    if(dayChecks){
      const counter = cur.querySelector("#dayCount");
      dayChecks.querySelectorAll(".check").forEach(c=>{
        c.onclick = ()=>{
          const k=c.dataset.day; const p=P();
          c.classList.toggle("checked");
          if(c.classList.contains("checked")){ if(!p.recurDays.includes(k)) p.recurDays.push(k); }
          else { p.recurDays = p.recurDays.filter(d=>d!==k); }
          // keep Mon–Fri order
          const order=["Mon","Tue","Wed","Thu","Fri"];
          p.recurDays.sort((a,b)=>order.indexOf(a)-order.indexOf(b));
          if(counter) counter.textContent = p.recurDays.length ? p.recurDays.length+" day(s)/week selected" : "No days selected yet";
          const em = cur.querySelector("#err-recur"); if(em) em.classList.remove("show");
        };
      });
    }
  }

  // upload
  const drop = cur.querySelector("#drop");
  const fileInput = cur.querySelector("#fileInput");
  if(drop){
    drop.onclick = ()=> fileInput.click();
    fileInput.onchange = ()=> addFiles(fileInput.files);
    ["dragover","dragenter"].forEach(ev=> drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("drag");}));
    ["dragleave","drop"].forEach(ev=> drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("drag");}));
    drop.addEventListener("drop", e=> addFiles(e.dataTransfer.files));
    renderFiles();
  }

  // NPI digits only
  const npi = cur.querySelector("#npi");
  if(npi) npi.addEventListener("input", ()=> npi.value = npi.value.replace(/\D/g,"").slice(0,10));

  // language "Other" reveal
  const langSel = cur.querySelector("#language");
  if(langSel){
    langSel.onchange = ()=>{
      P().language = langSel.value;
      const w = cur.querySelector("#langOtherWrap");
      if(w){
        const on = langSel.value==="Other";
        w.style.display = on ? "" : "none";
        if(on){ const i=cur.querySelector("#languageOther"); if(i) setTimeout(()=>i.focus(),50); }
        else { const i=cur.querySelector("#languageOther"); if(i) i.value=""; P().languageOther=""; }
      }
      const em = cur.querySelector("#err-patient"); if(em) em.classList.remove("show");
    };
  }

  // notification consent
  const consent = cur.querySelector("#consentCheck");
  if(consent){
    consent.onclick = ()=>{
      consent.classList.toggle("checked");
      form.notifyConsent = consent.classList.contains("checked");
      const em = cur.querySelector("#err-submitter"); if(em) em.classList.remove("show");
      if(form.notifyConsent){ const ne=cur.querySelector("#notifyEmail"); if(ne && !ne.value){ setTimeout(()=>ne.focus(),50); } }
    };
  }
  // Live preview + validation for multiple notification emails
  const notifyInput = cur.querySelector("#notifyEmail");
  const notifyPrev = cur.querySelector("#notifyPreview");
  function renderNotifyPreview(){
    if(!notifyPrev) return;
    const list = (notifyInput.value||"").split(",").map(s=>s.trim()).filter(Boolean);
    if(!list.length){ notifyPrev.innerHTML=""; return; }
    notifyPrev.innerHTML = list.map(e=>{
      const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
      return `<span class="sel-chip mini" style="${ok?'':'background:#fdeaea;color:#b23a3a'}">${esc(e)}${ok?'':' ⚠'}</span>`;
    }).join("");
  }
  if(notifyInput){
    notifyInput.addEventListener("input", ()=>{ form.notifyEmail = notifyInput.value; renderNotifyPreview(); });
    renderNotifyPreview();
  }

  // gate roster
  const rl = cur.querySelector("#rosterList");
  if(rl) renderRoster(rl);
  const addBtn = cur.querySelector("#addPatientBtn");
  if(addBtn) addBtn.onclick = startNewPatient;

  // submit / restart
  const sb = cur.querySelector("#submitBtn");
  if(sb) sb.onclick = async ()=>{
    sb.disabled = true;
    const orig = sb.textContent;
    sb.textContent = "Submitting...";
    const res = await submitToSupabase();
    if(res.ok){
      const di=seq.findIndex(s=>s.key==="done"); go(di,"up");
    } else {
      sb.disabled = false; sb.textContent = orig;
      showSubmitError(res.error);
    }
  };
  const nb = cur.querySelector("#newBtn");
  if(nb) nb.onclick = ()=> location.reload();
}

function renderRoster(el){
  if(form.patients.length===0){ el.innerHTML = `<div class="roster-empty">No patients yet.</div>`; return; }
  el.innerHTML = form.patients.map((p,i)=>`
    <div class="roster-item">
      <span class="idx">${i+1}</span>
      <div class="meta">
        <div class="rn">${esc(fullName(p))||"Unnamed patient"}</div>
        <div class="rd">${esc((testNames(p).join(", ")||"No tests"))}${p.mrn?" · MRN "+esc(p.mrn):""}</div>
      </div>
      <div class="ract">
        <button data-edit="${i}">Edit</button>
        <button class="del" data-del="${i}">Delete</button>
      </div>
    </div>`).join("");
  el.querySelectorAll("[data-edit]").forEach(b=> b.onclick=()=>editPatient(+b.dataset.edit));
  el.querySelectorAll("[data-del]").forEach(b=> b.onclick=()=>deletePatient(+b.dataset.del));
}

// ---------- Files ----------
function addFiles(fileList){
  const p=P();
  [...fileList].forEach(f=>{
    if(f.size>15*1024*1024){ alert(`"${f.name}" exceeds 15 MB.`); return; }
    // Keep the real File object so we can upload the bytes on submit.
    // (One requisition per patient — replace rather than append.)
    p.files = [{ name:f.name, size:f.size, blob:f }];
  });
  renderFiles();
}
function renderFiles(){
  const list = els[0].querySelector("#fileList");
  if(!list) return;
  const p=P();
  list.innerHTML = p.files.map((f,i)=>`
    <div class="file-chip">
      <span>📎</span>
      <span class="fname">${esc(f.name)}</span>
      <span class="fsize">${(f.size/1024/1024).toFixed(2)} MB</span>
      <button data-rm="${i}" aria-label="Remove">×</button>
    </div>`).join("");
  list.querySelectorAll("[data-rm]").forEach(b=>{
    b.onclick=()=>{ p.files.splice(+b.dataset.rm,1); renderFiles(); };
  });
}

// ---------- Keyboard ----------
document.addEventListener("keydown", e=>{
  const k = seq[idx].key;
  if(e.key==="Enter" && !e.shiftKey){
    const tag = document.activeElement.tagName;
    if(tag==="TEXTAREA") return;
    if(k==="mode"||k==="gate"||k==="done") return;
    e.preventDefault();
    if(k==="review"){ const di=seq.findIndex(s=>s.key==="done"); go(di,"up"); return; }
    next();
  }
});
document.getElementById("upBtn").onclick = prev;
document.getElementById("downBtn").onclick = ()=> next();

// ---------- Boot ----------
render();
</script>
</body>
</html>
